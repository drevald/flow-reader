apply plugin: 'com.android.application'
apply plugin: 'cpp'

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

android {

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "com.veve.flowreader"
        minSdkVersion 21
        targetSdkVersion 36
        def offset = System.getenv("VERSION_CODE_OFFSET") ? System.getenv("VERSION_CODE_OFFSET").toInteger() : 0
        def buildNum = System.getenv("BUILD_NUMBER") ? System.getenv("BUILD_NUMBER").toInteger() : 0
        println "DEBUG: VERSION_CODE_OFFSET=${System.getenv('VERSION_CODE_OFFSET')}, BUILD_NUMBER=${System.getenv('BUILD_NUMBER')}, offset=$offset, buildNum=$buildNum"
        versionCode (buildNum > 0 ? offset + buildNum : 100)
        versionName "1.0"
        buildConfigField "String", "GitHash", "\"${getGitHash()}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = "true"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        ndkVersion "30.0.16248370"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                // No release keystore available (local dev or CI smoke test).
                // Fall back to the debug keystore so the app can still be installed
                // on a device/emulator for instrumented tests.
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'jni/reflowlib'
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    adbOptions {
        timeOutInMs 60 * 1000 * 10 
    }

    lintOptions {
        abortOnError false
        checkAllWarnings false
        checkReleaseBuilds false
        ignoreWarnings true
        quiet true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.test:monitor:1.5.0'
        }
    }
    // CI sets TEST_BUILD_TYPE=release so instrumented tests run against the R8-minified
    // build, catching stripping issues before they reach production.
    // Locally (no env var) tests run against debug for fast iteration.
    testBuildType System.getenv("TEST_BUILD_TYPE") ?: "debug"

    buildToolsVersion '35.0.0'
    compileSdkVersion 35
    namespace 'com.veve.flowreader'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    implementation 'org.apache.commons:commons-lang3:3.7'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation group: 'androidx.test', name: 'rules', version: '1.5.0'
    implementation 'androidx.room:room-runtime:2.2.5'
    annotationProcessor 'androidx.room:room-compiler:2.2.5'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.10.0'
    androidTestImplementation ('androidx.test.espresso:espresso-contrib:3.5.1') {
        exclude group: 'com.android.support', module: 'appcompat'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude module: 'recyclerview-v7'
    }
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

}

